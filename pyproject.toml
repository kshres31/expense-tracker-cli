[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-ledger"
version = "0.1.0"
description = "A small SQLite-backed expense tracker for the terminal"
requires-python = ">=3.10"

[project.scripts]
pocket-ledger = "expense_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

